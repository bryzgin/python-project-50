[project]
name = "hexlet-code"
version = "0.1.0"
description = "Gendiff project on Hexlet"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.3",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]

[tool.hatch.build.targets.wheel]
packages = ["gendiff"]

[project.scripts]
gendiff = "gendiff.scripts.gendiff:main"

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.coverage.run]
relative_files = true
source = ["gendiff"]

[tool.coverage.paths]
source = [
    "gendiff",
    "*/site-packages/gendiff",
    ".venv/lib/*/site-packages/gendiff"
]
