[project]
name = "hexlet-code"
version = "0.1.0"
description = "Gendiff project on Hexlet"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gendiff"]

[project.scripts]
gendiff = "gendiff.scripts.gendiff:main"
